name: Codemong Check

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "검사할 사용자 커밋 SHA"
        required: true
        type: string
      mission_id:
        description: "검사할 미션 ID"
        required: true
        type: string

run-name: "Codemong Check - ${{ inputs.mission_id }} - ${{ inputs.target_sha }}"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout user code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          path: submission
          persist-credentials: false

      - name: Checkout Codemong answer test
        uses: actions/checkout@v6
        with:
          repository: dbstjdqls14/codemong-answer-test
          ref: step02
          token: ${{ secrets.CODEMONG_CHECKER_TOKEN }}
          path: checker

      - name: Copy hidden tests
        run: |
          mkdir -p submission/src/test/java
          cp -R checker/missions/${{ inputs.mission_id }}/src/test/java/* submission/src/test/java/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        working-directory: submission
        run: gradle test
